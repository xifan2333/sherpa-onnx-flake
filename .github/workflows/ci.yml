name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Pull-only: the cache is also pushed to by the fcitx5-vinput
      # nix-cache workflow. Pushing happens in a best-effort step below so
      # a stale/unprivileged CACHIX_AUTH_TOKEN cannot fail the build.
      - uses: cachix/cachix-action@v17
        with:
          name: fcitx5-vinput

      - name: Build sherpa-onnx
        run: nix build .#sherpa-onnx --no-link --print-build-logs

      - name: Push to Cachix (best effort)
        continue-on-error: true
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "${CACHIX_AUTH_TOKEN}" ]]; then
            echo "CACHIX_AUTH_TOKEN is not set, skipping push."
            exit 0
          fi
          if ! cachix push fcitx5-vinput $(nix path-info --recursive .#sherpa-onnx); then
            echo "::warning::Cachix push failed; the token may be expired or lack write access to the fcitx5-vinput cache."
          fi
