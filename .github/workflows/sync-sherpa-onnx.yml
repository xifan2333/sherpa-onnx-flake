name: sync-sherpa-onnx

# Daily check for new k2-fsa/sherpa-onnx releases. When upstream is newer
# than the pinned `version` in packages/sherpa-onnx.nix, the bump script
# resolves the new commit sha and Nix SRI sha256, rewrites the file, and
# opens a PR. Manual workflow_dispatch accepts an explicit version override.
#
# Note: PRs created with the default GITHUB_TOKEN do NOT trigger other
# workflows. To get full CI on the bump PR, store a fine-grained PAT with
# `pull-requests: write` + `contents: write` as a repo secret named
# SYNC_PR_TOKEN; the workflow will pick it up below.

on:
  schedule:
    - cron: '17 3 * * *'  # 03:17 UTC, off the :00/:30 storm
  workflow_dispatch:
    inputs:
      version:
        description: 'Override target sherpa-onnx version (no leading v). Empty = use upstream latest.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-sherpa-onnx
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Resolve target version
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${OVERRIDE}" ]]; then
            target="${OVERRIDE}"
          else
            target="$({
              gh api --paginate 'repos/k2-fsa/sherpa-onnx/releases?per_page=100' \
                --jq '.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tag_name' |
                sort -V |
                tail -n 1
            } | sed 's/^v//')"
          fi
          if [[ ! "${target}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid sherpa-onnx release version: ${target:-<empty>}" >&2
            exit 1
          fi
          current=$(awk -F\" '/^[[:space:]]*version[[:space:]]*=/ {print $2; exit}' packages/sherpa-onnx.nix)
          echo "current=${current}" >> "${GITHUB_OUTPUT}"
          echo "target=${target}"   >> "${GITHUB_OUTPUT}"
          if [[ "${current}" == "${target}" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Already pinned at v${target}, nothing to do." >&2
          fi

      - name: Bump pinned version
        if: steps.target.outputs.skip != 'true'
        run: bash scripts/bump-sherpa-onnx.sh "${{ steps.target.outputs.target }}"

      - name: Open PR
        if: steps.target.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          branch: chore/sherpa-onnx-${{ steps.target.outputs.target }}
          delete-branch: true
          commit-message: |
            chore: bump sherpa-onnx to v${{ steps.target.outputs.target }}
          title: 'chore: bump sherpa-onnx to v${{ steps.target.outputs.target }}'
          body: |
            Auto-generated by `.github/workflows/sync-sherpa-onnx.yml`.

            - previous: `v${{ steps.target.outputs.current }}`
            - new:      `v${{ steps.target.outputs.target }}`
            - upstream release: https://github.com/k2-fsa/sherpa-onnx/releases/tag/v${{ steps.target.outputs.target }}

            Updated: `packages/sherpa-onnx.nix` (`version` / `rev` / `sha256`).

            Downstream consumers (e.g. `xifan2333/fcitx5-vinput`) will pick this
            up the next time they run `nix flake update sherpa-onnx`.
          labels: |
            dependencies
            automated
